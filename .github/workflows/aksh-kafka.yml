name: "aksh kafka"
"on": workflow_dispatch:
jobs:
  build:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: apache/kafka
          path: kafka
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        working-directory: kafka
        run: ./gradlew compileJava 2>&1 || true
