name: "aksh pulsar"
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: [self-hosted, campaign-pulsar]
    steps:
      - uses: actions/checkout@v4
        with:
          repository:  echo "apache/echarts";;
            vscode) echo "microsoft/vscode";;
            angular) echo "angular/angular";;
            n8n) echo "n8n-io/n8n";;
            rocketmq) echo "apache/rocketmq";;
            pulsar) echo "apache/pulsar";;
            cilium) echo "cilium/cilium";;
            kafka) echo "apache/kafka";;
          esac)
          path: project
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check project
        working-directory: project
        run: |
          echo "Project: pulsar"
          echo "Directory contents:"
          ls -la
          echo "Git log:"
          git log --oneline -3
